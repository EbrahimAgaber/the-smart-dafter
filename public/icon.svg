<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="3" opacity="0.4" />

  <!-- Ledger Cover -->
  <g transform="translate(96, 80)">
    <!-- Book Shadow -->
    <rect x="24" y="24" width="280" height="340" rx="28" fill="#000000" opacity="0.5" />
    
    <!-- Outer Book Base -->
    <rect x="12" y="12" width="286" height="336" rx="26" fill="url(#bookGrad)" stroke="#334155" stroke-width="4" />

    <!-- Spine Ribbon -->
    <rect x="12" y="12" width="44" height="336" rx="16" fill="url(#accentGrad)" />
    
    <!-- Stitching marks on spine -->
    <line x1="34" y1="50" x2="34" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="34" y1="130" x2="34" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="34" y1="210" x2="34" y2="240" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="34" y1="290" x2="34" y2="320" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Ledger Page Interior Preview -->
    <rect x="74" y="36" width="206" height="288" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

    <!-- Ledger Rows -->
    <rect x="94" y="66" width="70" height="12" rx="6" fill="#38bdf8" />
    <rect x="180" y="66" width="80" height="12" rx="6" fill="#10b981" />

    <line x1="94" y1="100" x2="260" y2="100" stroke="#1e293b" stroke-width="2" />

    <!-- Line items simulated -->
    <circle cx="106" cy="128" r="6" fill="#10b981" />
    <rect x="124" y="123" width="70" height="10" rx="5" fill="#475569" />
    <rect x="210" y="123" width="50" height="10" rx="5" fill="#10b981" />

    <circle cx="106" cy="164" r="6" fill="#f43f5e" />
    <rect x="124" y="159" width="80" height="10" rx="5" fill="#475569" />
    <rect x="218" y="159" width="42" height="10" rx="5" fill="#f43f5e" />

    <circle cx="106" cy="200" r="6" fill="#38bdf8" />
    <rect x="124" y="195" width="60" height="10" rx="5" fill="#475569" />
    <rect x="206" y="195" width="54" height="10" rx="5" fill="#38bdf8" />

    <line x1="94" y1="232" x2="260" y2="232" stroke="#334155" stroke-dasharray="4 4" stroke-width="2" />

    <!-- Total Badge -->
    <rect x="94" y="254" width="166" height="46" rx="12" fill="url(#accentGrad)" opacity="0.15" />
    <rect x="94" y="254" width="166" height="46" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    
    <!-- Smart Chip Icon -->
    <g transform="translate(112, 267)">
      <path d="M0 4 C0 1.8 1.8 0 4 0 L16 0 C18.2 0 20 1.8 20 4 L20 16 C20 18.2 18.2 20 16 20 L4 20 C1.8 20 0 18.2 0 16 Z" fill="url(#accentGrad)" />
      <path d="M7 10 L10 13 L14 7" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="144" y="272" width="94" height="11" rx="5.5" fill="#e2e8f0" />
  </g>

  <!-- Glowing Corner Smart Indicator -->
  <g transform="translate(356, 68)" filter="url(#glow)">
    <circle cx="28" cy="28" r="24" fill="url(#accentGrad)" />
    <path d="M28 16 L28 40 M16 28 L40 28" stroke="#020617" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
